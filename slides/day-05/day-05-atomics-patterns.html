<h2 id="counter-in-one-step"><code>counter++</code> in one step</h2>
<ul>
<li data-marpit-fragment="1">Day 3: <code>counter++</code> is three steps — load, add, store — and another thread can run between them</li>
<li data-marpit-fragment="2">
<blockquote>
<p>An <strong>atomic operation</strong> happens in <strong>one</strong> step: every other thread sees it not started yet, or finished — never halfway.</p>
</blockquote>
</li>
<li data-marpit-fragment="3">The CPU has instructions for this. For that one instruction, its core keeps the memory to itself — no lock object, no sleeping, no OS</li>
<li data-marpit-fragment="4">Same idea elsewhere: Java <code>AtomicInteger</code>, Go <code>atomic.Int64</code>, C# <code>Interlocked</code>, Rust <code>AtomicI64</code>, JavaScript <code>Atomics</code> — Python has none: use a <code>Lock</code></li>
</ul>
<footer>Atomics &amp; Concurrency Patterns</footer>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp">std::atomic&lt;<span class="hljs-type">int</span>&gt; counter{<span class="hljs-number">0</span>};

<h2 id="two-threads-one-atomic-add">Two threads, one atomic add</h2>
<p><code>counter</code> is 5. Both threads run <code>counter++</code> at the same moment.</p>
<table>
<thead>
<tr>
<th></th>
<th>Core 1 · thread A</th>
<th>Core 2 · thread B</th>
<th><code>counter</code></th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>holds the memory: read 5, write 6 — one step</td>
<td>waits — a few nanoseconds, in hardware</td>
<td>6</td>
</tr>
<tr>
<td>2</td>
<td></td>
<td>holds the memory: read 6, write 7</td>
<td>7</td>
</tr>
</tbody>
</table>
<ul>
<li data-marpit-fragment="1">Two adds, +2 — nothing lost</li>
<li data-marpit-fragment="2">Each add also gives back the value it replaced: A gets 5, B gets 6 — never the same one twice</li>
</ul>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp">std::atomic&lt;<span class="hljs-type">long</span> <span class="hljs-type">long</span>&gt; balance{<span class="hljs-number">100</span>};

<li data-marpit-fragment="2">
<blockquote>

</blockquote>

</ul>

<h2 id="compare-and-swap-1">Compare-and-swap</h2>
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><strong>compare-and-swap(x, expected, new)</strong>: &quot;if <code>x</code> is still <code>expected</code>, set it to <code>new</code> — and tell me if it worked.&quot; One step.</p>
</blockquote>
</li>
<li data-marpit-fragment="2">It's check-then-act — done by the hardware, so nothing can get in between the check and the act</li>
<li data-marpit-fragment="3">It <strong>fails</strong> if someone changed <code>x</code> since you read it. Then: read again, decide again, try again</li>
<li data-marpit-fragment="4">It's the universal one: every other atomic operation can be built from it</li>
</ul>
<footer>Atomics &amp; Concurrency Patterns</footer>
</section>

<h2 id="%E2%9D%8C-why-not-build-cas-from-load-and-store">❌ Why not build CAS from <code>load</code> and <code>store</code>?</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">bool</span> <span class="hljs-title">myCas</span><span class="hljs-params">(std::atomic&lt;<span class="hljs-type">long</span> <span class="hljs-type">long</span>&gt;&amp; x, <span class="hljs-type">long</span> <span class="hljs-type">long</span> expected, <span class="hljs-type">long</span> <span class="hljs-type">long</span> desired)</span> </span>{
    <span class="hljs-keyword">if</span> (x.<span class="hljs-built_in">load</span>() != expected) <span class="hljs-keyword">return</span> <span class="hljs-literal">false</span>;    <span class="hljs-comment">// check — atomic</span>
    x.<span class="hljs-built_in">store</span>(desired);                          <span class="hljs-comment">// act — atomic</span>
    <span class="hljs-keyword">return</span> <span class="hljs-literal">true</span>;
}
</code></pre>
<p><code>balance</code> is 100; both threads call <code>myCas(balance, 100, 0)</code> to withdraw 100.</p>
<table>
<thead>
<tr>
<th></th>
<th>Thread A</th>
<th>Thread B</th>
<th><code>balance</code></th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td><code>load</code> → 100 — matches</td>
<td></td>
<td>100</td>
</tr>
<tr>
<td>2</td>
<td></td>
<td><code>load</code> → 100 — matches</td>
<td>100</td>
</tr>
<tr>
<td>3</td>
<td><code>store(0)</code> → <code>true</code></td>
<td></td>
<td>0</td>
</tr>
<tr>
<td>4</td>
<td></td>
<td><code>store(0)</code> → <code>true</code></td>
<td>0</td>
</tr>
</tbody>
</table>
<ul>
<li data-marpit-fragment="1">Both won: 200 paid out of 100. Two atomic steps leave a gap — CAS must be <strong>one</strong> instruction</li>
</ul>
<footer>Atomics &amp; Concurrency Patterns</footer>

<h2 id="%E2%9C%85-the-withdrawal-with-compare-and-swap">✅ The withdrawal with compare-and-swap</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">bool</span> <span class="hljs-title">withdraw</span><span class="hljs-params">(<span class="hljs-type">long</span> <span class="hljs-type">long</span> amount)</span> </span>{
    <span class="hljs-type">long</span> <span class="hljs-type">long</span> cur = balance.<span class="hljs-built_in">load</span>();
    <span class="hljs-keyword">while</span> (cur &gt;= amount) {
        <span class="hljs-keyword">if</span> (balance.<span class="hljs-built_in">compare_exchange_weak</span>(cur, cur - amount))
            <span class="hljs-keyword">return</span> <span class="hljs-literal">true</span>;            <span class="hljs-comment">// still cur? then cur - amount — done</span>
        <span class="hljs-comment">// failed: someone changed it; cur now holds the new value</span>
    }
    <span class="hljs-keyword">return</span> <span class="hljs-literal">false</span>;                   <span class="hljs-comment">// not enough money</span>
}
</code></pre>
<ul>
<li data-marpit-fragment="1">The <strong>CAS loop</strong>: read → decide → CAS → if it failed, decide again with the fresh value</li>
<li data-marpit-fragment="2">Never negative: a withdrawal only lands if the balance is still the one it checked</li>
</ul>

<p><code>balance</code> is 100. Both threads call <code>withdraw(100)</code>.</p>
<table>

<h2 id="the-cas-loop-any-update-to-one-variable">The CAS loop: any update to one variable</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp">T cur = x.<span class="hljs-built_in">load</span>();

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp">std::atomic&lt;<span class="hljs-type">long</span>&gt; peak{<span class="hljs-number">0</span>};

    <span class="hljs-type">long</span> cur = peak.<span class="hljs-built_in">load</span>();
    <span class="hljs-keyword">while</span> (ms &gt; cur &amp;&amp; !peak.<span class="hljs-built_in">compare_exchange_weak</span>(cur, ms)) {}
}
</code></pre>
<ul>
<li data-marpit-fragment="1">Works for max, min, &quot;add but never above 100&quot;, &quot;set if not set yet&quot; — anything computed from <strong>one</strong> variable</li>

<h2 id="optimistic-vs-pessimistic">Optimistic vs. pessimistic</h2>
<ul>
<li data-marpit-fragment="1">A <strong>mutex is pessimistic</strong>: &quot;someone may get in my way — lock first, then work&quot;</li>
<li data-marpit-fragment="2">A <strong>CAS loop is optimistic</strong>: &quot;nobody will — work first, then check; if I was wrong, redo it&quot;</li>
<li data-marpit-fragment="3">Few threads in a fight → optimistic wins: nobody waits, nobody sleeps</li>
<li data-marpit-fragment="4">Many threads in a fight → optimistic loses: they redo the same work again and again. A CAS loop never sleeps — it spins, like Day 4's busy waiting</li>
</ul>
<footer>Atomics &amp; Concurrency Patterns</footer>
</section>

<h2 id="the-same-idea-far-from-c">The same idea, far from C++</h2>
<ul>
<li data-marpit-fragment="1"><strong>Databases</strong> — optimistic locking:<br />

<li data-marpit-fragment="2"><strong>HTTP</strong> — <code>PUT</code> with <code>If-Match: &quot;v7&quot;</code> → <code>412 Precondition Failed</code> if it changed in between</li>
<li data-marpit-fragment="3"><strong>Git</strong> — <code>git push</code> is rejected if the remote moved since you fetched: pull, try again</li>
<li data-marpit-fragment="4">
<blockquote>
<p>Compare-and-swap isn't a C++ feature. It's how to change shared state <strong>without holding a lock</strong>.</p>

;" data-marpit-pagination-total="41">
<h2 id="why-one-shared-atomic-gets-slow">Why one shared atomic gets slow</h2>
<ul>
<li data-marpit-fragment="1">Memory travels between RAM and the cores' caches in blocks: <strong>cache lines</strong> — 64 bytes on most CPUs</li>
<li data-marpit-fragment="2">To write, a core must hold the line <strong>alone</strong> — every other core's copy is thrown away</li>
<li data-marpit-fragment="3">One counter, many cores adding: the line travels from core to core, on every add</li>
<li data-marpit-fragment="4">
<blockquote>
<p>An atomic doesn't remove the fight — it makes it cheaper. Many threads writing one variable is still a line, in hardware.</p>
</blockquote>
</li>
</ul>
<footer>Atomics &amp; Concurrency Patterns</footer>
</section>

<h2 id="%E2%9C%85-dont-share-it-a-counter-per-thread">✅ Don't share it: a counter per thread</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">struct</span> <span class="hljs-title class_">alignas</span>(<span class="hljs-number">64</span>) Slot { std::atomic&lt;<span class="hljs-type">long</span>&gt; n{<span class="hljs-number">0</span>}; };   <span class="hljs-comment">// one cache line each</span>
Slot perThread[<span class="hljs-number">8</span>];

<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">hit</span><span class="hljs-params">(<span class="hljs-type">int</span> t)</span> </span>{ perThread[t].n++; }         <span class="hljs-comment">// stays in this core&#x27;s cache</span>

<span class="hljs-function"><span class="hljs-type">long</span> <span class="hljs-title">total</span><span class="hljs-params">()</span> </span>{                                <span class="hljs-comment">// rare: add them up</span>
    <span class="hljs-type">long</span> sum = <span class="hljs-number">0</span>;
    <span class="hljs-keyword">for</span> (<span class="hljs-keyword">auto</span>&amp; s : perThread) sum += s.n;
    <span class="hljs-keyword">return</span> sum;
}
</code></pre>
<ul>
<li data-marpit-fragment="1">Writes stay on their own core; only reading the total touches every line — fine for counters and statistics</li>
<li data-marpit-fragment="2">Without <code>alignas(64)</code>: separate counters, <strong>one</strong> line — it travels anyway. That's <strong>false sharing</strong></li>
<li data-marpit-fragment="3">Same idea elsewhere: Java <code>LongAdder</code> — and Day 4's queue per worker</li>
</ul>

<h2 id="%E2%9D%8C-a-stop-flag--a-plain-bool">❌ A stop flag — a plain <code>bool</code></h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-type">bool</span> running = <span class="hljs-literal">true</span>;               <span class="hljs-comment">// shared, no lock</span>

<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">worker</span><span class="hljs-params">()</span> </span>{
    <span class="hljs-keyword">while</span> (running) <span class="hljs-built_in">step</span>();
}

<span class="hljs-comment">// main thread:</span>
running = <span class="hljs-literal">false</span>;                   <span class="hljs-comment">// &quot;please stop&quot;</span>
t.<span class="hljs-built_in">join</span>();
</code></pre>
<ul>
<li data-marpit-fragment="1">One thread writes, another reads, no lock: a <strong>data race</strong>. So the compiler may assume nobody else changes <code>running</code> — read it <strong>once</strong>, and loop forever. Optimized builds really do this</li>
<li data-marpit-fragment="2">✅ <code>std::atomic&lt;bool&gt; running{true};</code> — every check really reads it</li>
<li data-marpit-fragment="3">Same idea elsewhere: Java <code>AtomicBoolean</code> or <code>volatile</code>, Go <code>atomic.Bool</code>, Rust <code>AtomicBool</code>, C# <code>CancellationToken</code></li>
</ul>
<p class="note">C++ <code>volatile</code> is not the fix — in C++ it makes nothing atomic. Java's <code>volatile</code> is a different thing, and does work here.</p>
<footer>Atomics &amp; Concurrency Patterns</footer>
</section>

<h2 id="challenge-build-a-mutex">Challenge: build a mutex</h2>
<p>Only today's tools — atomic <code>load</code>, <code>store</code>, <code>exchange</code>, compare-and-swap. No <code>std::mutex</code>.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Mutex</span> {
    <span class="hljs-comment">// your state here</span>
<span class="hljs-keyword">public</span>:
    <span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">lock</span><span class="hljs-params">()</span></span>;      <span class="hljs-comment">// returns only when this thread owns the lock</span>
    <span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">unlock</span><span class="hljs-params">()</span></span>;    <span class="hljs-comment">// lets another thread in</span>
};
</code></pre>
<ul>
<li data-marpit-fragment="1">Two threads must never be between <code>lock()</code> and <code>unlock()</code> at the same time</li>
<li data-marpit-fragment="2">What is the state? What does <code>lock()</code> do when the lock is already taken?</li>
<li data-marpit-fragment="3">&quot;If it's free, take it&quot; — what does that look like as <strong>one</strong> step?</li>
</ul>

<h2 id="%E2%9C%85-a-simple-mutex">✅ A simple mutex</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Mutex</span> {
    std::atomic&lt;<span class="hljs-type">bool</span>&gt; locked{<span class="hljs-literal">false</span>};
<span class="hljs-keyword">public</span>:
    <span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">lock</span><span class="hljs-params">()</span> </span>{
        <span class="hljs-type">bool</span> expected = <span class="hljs-literal">false</span>;
        <span class="hljs-keyword">while</span> (!locked.<span class="hljs-built_in">compare_exchange_weak</span>(expected, <span class="hljs-literal">true</span>))   <span class="hljs-comment">// free? then take it — one step</span>
            expected = <span class="hljs-literal">false</span>;                                   <span class="hljs-comment">// it was taken: try again</span>
    }
    <span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">unlock</span><span class="hljs-params">()</span> </span>{ locked.<span class="hljs-built_in">store</span>(<span class="hljs-literal">false</span>); }                      <span class="hljs-comment">// free again</span>
};
</code></pre>
<ul>
<li data-marpit-fragment="1">&quot;If free, take it&quot; is check-then-act — so it must be <strong>one</strong> CAS. A <code>load</code> + <code>store</code> lets two threads in</li>
<li data-marpit-fragment="2">Also works: <code>while (locked.exchange(true)) {}</code> — &quot;set it taken; was it taken before?&quot;</li>
<li data-marpit-fragment="3">While it's taken, <code>lock()</code> spins — a <strong>spinlock</strong>: fine for a few instructions; Day 4: don't spin for long</li>
<li data-marpit-fragment="4">A real mutex = this CAS for the fast path + Day 4's waiting room when it's taken</li>
</ul>
<footer>Atomics &amp; Concurrency Patterns</footer>
</section>

<h2 id="reference-counts--atomics-you-already-use">Reference counts — atomics you already use</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">retain</span><span class="hljs-params">()</span>  </span>{ refs.<span class="hljs-built_in">fetch_add</span>(<span class="hljs-number">1</span>); }

<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">release</span><span class="hljs-params">()</span> </span>{
    <span class="hljs-keyword">if</span> (refs.<span class="hljs-built_in">fetch_sub</span>(<span class="hljs-number">1</span>) == <span class="hljs-number">1</span>)       <span class="hljs-comment">// the old value was 1: I was the last one</span>
        <span class="hljs-keyword">delete</span> <span class="hljs-keyword">this</span>;
}
</code></pre>
<ul>
<li data-marpit-fragment="1">Every copy of a <code>std::shared_ptr</code> does <code>fetch_add</code>; every destructor does <code>fetch_sub</code></li>
<li data-marpit-fragment="2">&quot;Was I the last?&quot; must be decided in the <strong>same</strong> step as the decrement — as two steps, two threads could both see 0 and delete twice</li>
<li data-marpit-fragment="3">Same idea elsewhere: Rust <code>Arc</code>, Swift ARC, Objective-C, COM <code>AddRef</code> / <code>Release</code></li>
</ul>

<h2 id="atomic-or-mutex">Atomic or mutex?</h2>
<table>
<thead>
<tr>
<th>Situation</th>
<th>Use</th>
</tr>
</thead>
<tbody>
<tr>
<td>one variable, one simple update — count, flag, ID, max</td>
<td><strong>atomic</strong></td>
</tr>
<tr>
<td>a rule that ties two or more variables together</td>
<td><strong>mutex</strong></td>
</tr>
<tr>
<td>a whole structure — map, queue, list</td>
<td><strong>mutex</strong> — or a tested library</td>
</tr>
<tr>
<td>this lock is the bottleneck, and you measured it</td>
<td><strong>shard it</strong> — a counter or a queue per thread</td>
</tr>
</tbody>
</table>
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p>When in doubt, a mutex: clear and correct first, fast second.</p>
</blockquote>
</li>
</ul>
<footer>Atomics &amp; Concurrency Patterns</footer>
</section>

<h2 id="the-same-atomics-in-every-language">The same atomics, in every language</h2>
<table>
<thead>
<tr>
<th></th>
<th>C++</th>
<th>Java</th>
<th>Go</th>
<th>Python</th>
<th>C#</th>
<th>Rust</th>
</tr>
</thead>
<tbody>
<tr>
<td>atomic integer</td>
<td><code>atomic&lt;long&gt;</code></td>
<td><code>AtomicLong</code></td>
<td><code>atomic.Int64</code></td>
<td>— use a <code>Lock</code></td>
<td><code>Interlocked</code> on a <code>long</code></td>
<td><code>AtomicI64</code></td>
</tr>
<tr>
<td>add</td>
<td><code>fetch_add</code></td>
<td><code>getAndAdd</code></td>
<td><code>Add</code></td>
<td>—</td>
<td><code>Interlocked.Add</code></td>
<td><code>fetch_add</code></td>
</tr>
<tr>
<td>compare-and-swap</td>
<td><code>compare_exchange_weak</code></td>
<td><code>compareAndSet</code></td>
<td><code>CompareAndSwap</code></td>
<td>—</td>
<td><code>Interlocked.CompareExchange</code></td>
<td><code>compare_exchange</code></td>
</tr>
<tr>
<td>flag</td>
<td><code>atomic&lt;bool&gt;</code></td>
<td><code>AtomicBoolean</code></td>
<td><code>atomic.Bool</code></td>
<td><code>threading.Event</code></td>
<td><code>CancellationToken</code></td>

<h2 id="same-problem-different-shapes">Same problem, different shapes</h2>
<ul>
<li data-marpit-fragment="1">So far: <strong>threads + locks</strong> — share the memory, guard it (Day 3) · <strong>pool + futures</strong> — share the work, get results back (Day 4)</li>
<li data-marpit-fragment="2">Every shape answers one question: <em>who may touch the state?</em></li>
<li data-marpit-fragment="3">Three more shapes today: <strong>actors</strong>, <strong>the event loop</strong>, <strong>channels</strong></li>
<li data-marpit-fragment="4">The trick in all three: stop sharing mutable state — then there is nothing to lock</li>
</ul>
<footer>Atomics &amp; Concurrency Patterns</footer>
</section>

<h2 id="actors-state-with-one-owner">Actors: state with one owner</h2>
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p>An <strong>actor</strong> owns its state — nobody else touches it. To change it, you send it a <strong>message</strong>; it handles its messages one at a time.</p>
</blockquote>
</li>
<li data-marpit-fragment="2">The mailbox is Day 4's blocking queue — one per actor, one thread reading it</li>
<li data-marpit-fragment="3">No locks inside: only one thread ever touches the state</li>
<li data-marpit-fragment="4">Same idea elsewhere: Erlang / Elixir processes, Akka (Java, Scala), Orleans (C#), Swift <code>actor</code></li>
</ul>
<footer>Atomics &amp; Concurrency Patterns</footer>

<h2 id="actors-what-can-still-go-wrong">Actors: what can still go wrong</h2>
<ul>
<li data-marpit-fragment="1">Two actors each wait for the other's reply → <strong>deadlock</strong> — with no lock at all, like Day 4's pool</li>
<li data-marpit-fragment="2">A full mailbox: bounded → the sender waits (backpressure); unbounded → memory grows (Day 4: why bounded?)</li>
<li data-marpit-fragment="3">One slow message holds up every message behind it — keep handlers short</li>
<li data-marpit-fragment="4">Asking an actor for a value is a message too: the answer is already old when you read it</li>
</ul>
<footer>Atomics &amp; Concurrency Patterns</footer>

;" data-marpit-pagination-total="41">
<h2 id="event-loop-one-thread-many-waits">Event loop: one thread, many waits</h2>
<ul>
<li data-marpit-fragment="1">Most server work is <strong>waiting</strong>: for the network, the disk, the database</li>
<li data-marpit-fragment="2">A thread per request: 10,000 requests → 10,000 threads, almost all asleep (Day 4)</li>
<li data-marpit-fragment="3">
<blockquote>
<p><strong>Event loop</strong>: <strong>one</strong> thread and a queue of ready tasks. A task runs until it would wait — then it gives the thread back, and returns to the queue when its data arrives.</p>
</blockquote>
</li>
<li data-marpit-fragment="4">Many tasks in flight, one running at a time: concurrency <strong>without</strong> parallelism</li>
<li data-marpit-fragment="5">Same idea elsewhere: JavaScript / Node.js, Python <code>asyncio</code>, C# <code>async</code> / <code>await</code>, Rust tokio, nginx</li>
</ul>
<footer>Atomics &amp; Concurrency Patterns</footer>
</section>

<h2 id="the-loop-itself">The loop itself</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">ready = queue of tasks that can run now

loop forever:
    task = ready.pop()
    run task until it reaches an await          // it would have to wait
    when its data arrives — network, disk, timer:
        ready.push(task)                        // it can go on
</code></pre>
<ul>
<li data-marpit-fragment="1">Day 4's queue again — one consumer, and the producers are &quot;your data is here&quot;</li>
<li data-marpit-fragment="2"><code>async</code> / <code>await</code>: code that reads top to bottom; every <code>await</code> is a place where the task gives the thread back</li>
</ul>

<h2 id="channels-share-memory-by-communicating">Channels: share memory by communicating</h2>
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p>Go: &quot;Don't communicate by sharing memory; share memory by communicating.&quot;</p>
</blockquote>
</li>
<li data-marpit-fragment="2">A <strong>channel</strong> is Day 4's blocking queue, built into the language: send waits while it's full, receive waits while it's empty</li>
<li data-marpit-fragment="3">Goroutines don't share the data — they pass it along. Whoever holds a value owns it</li>
<li data-marpit-fragment="4">Same idea elsewhere: Rust <code>mpsc</code>, Kotlin <code>Channel</code>, C# <code>System.Threading.Channels</code>, Clojure <code>core.async</code></li>
</ul>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-go">ch := <span class="hljs-built_in">make</span>(<span class="hljs-keyword">chan</span> <span class="hljs-type">int</span>, <span class="hljs-number">10</span>)          <span class="hljs-comment">// Day 4&#x27;s bounded queue, built in</span>

<span class="hljs-keyword">go</span> <span class="hljs-function"><span class="hljs-keyword">func</span><span class="hljs-params">()</span></span> {                       <span class="hljs-comment">// producer</span>
    <span class="hljs-keyword">for</span> i := <span class="hljs-number">1</span>; i &lt;= <span class="hljs-number">3</span>; i++ {
        ch &lt;- i                   <span class="hljs-comment">// send: waits while the channel is full</span>
    }
    <span class="hljs-built_in">close</span>(ch)                     <span class="hljs-comment">// &quot;no more values&quot;</span>
}()

<span class="hljs-keyword">for</span> v := <span class="hljs-keyword">range</span> ch {               <span class="hljs-comment">// receive: waits while it&#x27;s empty; ends after close</span>

}

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-go"><span class="hljs-keyword">select</span> {

<span class="hljs-keyword">case</span> &lt;-time.After(time.Second):

}
</code></pre>

<h2 id="same-problems-different-shapes">Same problems, different shapes</h2>
<table>
<thead>
<tr>
<th></th>
<th>The state is…</th>
<th>Threads wait on…</th>
<th>Typical bug</th>
<th>Good for</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>threads + locks</strong></td>
<td>shared, behind locks</td>
<td>locks</td>
<td>races, deadlock</td>
<td>small shared structures</td>
</tr>
<tr>
<td><strong>pool + futures</strong></td>
<td>shared tasks; results come back</td>
<td><code>future.get()</code></td>
<td>waiting inside the pool</td>
<td>CPU work, many small jobs</td>
</tr>
<tr>
<td><strong>event loop</strong></td>
<td>owned by one thread</td>
<td>nothing — tasks <code>await</code></td>
<td>blocking the loop; races across <code>await</code></td>
<td>many network waits</td>
</tr>
<tr>
<td><strong>actors</strong></td>
<td>owned by each actor</td>
<td>its mailbox</td>
<td>actors waiting for each other</td>
<td>many independent things — accounts, players</td>
</tr>
<tr>
<td><strong>channels</strong></td>
<td>passed along, one owner at a time</td>
<td>send / receive</td>
<td>nobody closes; nobody receives</td>
<td>pipelines: stage → stage</td>
</tr>
</tbody>
</table>
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p>Your team project: which shape, and why? You will defend it.</p>
</blockquote>
</li>
</ul>
<footer>Atomics &amp; Concurrency Patterns</footer>
