/* Blueprint palette: patterns are, in this deck's own words, &quot;a
   blueprint you adapt&quot; — the UML diagrams already read as technical
   drawings, so the whole theme leans into that instead of a generic
   dark-mode-with-neon-accent look. */
section {
  --line: #6fa8cc;
  --panel: #14385a;
  --accent: #5cc8ea;
  --good: #7ed0a3;
  --bad: #f0a06e;

  --color-background: #0b2136;
  --color-foreground: #eef4f9;
  --color-dimmed: #a9c8de;
  --color-highlight: #5cc8ea;
  --color-background-stripe: rgba(92, 200, 234, .07);

  font-family: 'IBM Plex Sans', Helvetica, Arial, sans-serif;
  font-size: 25px;
  background-color: var(--color-background);
  background-image:
    repeating-linear-gradient(90deg, rgba(111, 168, 204, .06) 0 1px, transparent 1px 48px),
    repeating-linear-gradient(0deg, rgba(111, 168, 204, .06) 0 1px, transparent 1px 48px);
}

section.lead h1 {
  font-family: 'IBM Plex Sans Condensed', 'IBM Plex Sans', sans-serif;
  font-size: 56px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.02em;
}
section.lead h1::after {
  content: &quot;&quot;;
  display: block;
  width: 64px;
  height: 3px;
  margin: 20px auto 0;
  background: var(--accent);
}
section.lead h3 { font-family: 'IBM Plex Sans', sans-serif; font-size: 30px; font-weight: 400; opacity: 0.85; }

h2 {
  font-family: 'IBM Plex Sans Condensed', 'IBM Plex Sans', sans-serif;
  font-size: 34px;
  font-weight: 700;
  position: relative;
}
h2::after {
  content: &quot;&quot;;
  position: absolute;
  left: 1px;
  bottom: -8px;
  width: 40px;
  height: 3px;
  background: var(--accent);
}

code { font-size: 0.8em; font-family: 'IBM Plex Mono', Menlo, monospace; }
pre, pre code { font-family: 'IBM Plex Mono', Menlo, monospace; }

.tag {
  display: inline-block;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 3px 10px;
  opacity: 1;
}

blockquote {
  margin: 0.6em 0 0;
  padding: 10px 20px;
  background: var(--panel);
  border-left: 4px solid var(--accent);
  border-radius: 0 4px 4px 0;
  opacity: 1;
}
blockquote::before, blockquote::after { content: none; }

section.good { border-left: 6px solid var(--good); }
section.good h2 { color: var(--good); }
section.good h2::after { background: var(--good); }

/* The mirror of .good: slides where Day 1–2 code breaks. */
section.bad { border-left: 6px solid var(--bad); }
section.bad h2 { color: var(--bad); }
section.bad h2::after { background: var(--bad); }

section footer {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
section::after {
  content: attr(data-marpit-pagination) &quot;\2009/\2009&quot; attr(data-marpit-pagination-total);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
}

.uml { display: block; margin: 0 auto; }

/* A small aside -- a caveat that shouldn't compete with the slide. */
.note { font-size: 18px; color: var(--color-dimmed); margin-top: 1.4em; }
.note code { font-size: 0.9em; }

/* Step-by-step reveals: list items written with `*` appear one
   keypress at a time in the HTML export. Items that carry a quote
   panel shouldn't also show a list bullet. */
li:has(&gt; blockquote), li:has(svg) { list-style: none; }
li &gt; blockquote { margin: 0.2em 0 0.5em; }

/* Interleaving tables: one row per keypress. Rows sit flush, with no
   list indent, so they line up under the static header row and the
   two thread columns read as continuous timelines. */
ul:has(&gt; li &gt; svg.tl) { padding-left: 0; }
li:has(&gt; svg.tl) { margin: 0; line-height: 0; }

<h2 id="counter-is-not-one-step"><code>counter++</code> is not one step</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>load   r ← counter      // read the value into a register
add    r ← r + 1        // add one, inside the register
store  counter ← r      // write it back to memory
</code></pre>
<ul>
<li data-marpit-fragment="1">Another thread can run between any two of these steps</li>
<li data-marpit-fragment="2">On one core, the OS can switch threads right there; on two cores,<br />
both threads really do run at the same moment</li>
</ul>
<footer>Races, Critical Sections &amp; Mutexes</footer>

<h2 id="sequential-concurrent-parallel">Sequential, concurrent, parallel</h2>
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><strong>Sequential</strong> — one thing at a time, in order.</p>
</blockquote>
</li>
<li data-marpit-fragment="2">
<blockquote>
<p><strong>Concurrent</strong> — several tasks <strong>in progress</strong> during the same<br />
period, taking turns, possibly on one core.</p>
</blockquote>
</li>
<li data-marpit-fragment="3">
<blockquote>
<p><strong>Parallel</strong> — several tasks running <strong>at the same instant</strong>,<br />
on different cores.</p>
</blockquote>
</li>
<li data-marpit-fragment="4">The counter was concurrent — and, on a laptop with 10 cores,<br />
parallel too</li>
</ul>
<footer>Races, Critical Sections &amp; Mutexes</footer>
</section>

<h2 id="why-anyone-bothers">Why anyone bothers</h2>
<ul>
<li data-marpit-fragment="1"><strong>Hardware</strong> — single cores stopped getting faster around 2005;<br />
machines now grow by adding <strong>more cores</strong></li>
<li data-marpit-fragment="2"><strong>Hiding waits</strong> — while one task waits on disk or network,<br />
another runs</li>
<li data-marpit-fragment="3"><strong>Responsiveness</strong> — a UI must react while work happens behind it</li>
<li data-marpit-fragment="4"><strong>Throughput</strong> — a server serves thousands of clients at once</li>
</ul>
<footer>Races, Critical Sections &amp; Mutexes</footer>
</section>

<p>Threads <strong>share memory</strong> — so talking to each other is free<br />

</blockquote>
<ul>
<li data-marpit-fragment="1">The shared counter was the whole point of the two threads — and the<br />
poison.</li>
</ul>

<h2 id="race-condition-vs-data-race">Race condition vs. data race</h2>
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><strong>Race condition</strong> — the result depends on timing: on how the<br />
threads' steps happen to interleave.</p>
</blockquote>
</li>
<li data-marpit-fragment="2">
<blockquote>
<p><strong>Data race</strong> — two threads access the same memory at the same<br />
time, at least one of them writes, and nothing coordinates them.</p>
</blockquote>
</li>
<li data-marpit-fragment="3">The data race is the defect in the code; the race condition is what<br />
you see from outside</li>
<li data-marpit-fragment="4">In C++, a data race is <strong>undefined behavior</strong> — the compiler is<br />
allowed to assume it never happens</li>
</ul>
<footer>Races, Critical Sections &amp; Mutexes</footer>
</section>

<h2 id="an-image-cache">An image cache</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp">std::unordered_map&lt;std::string, Image&gt; cache;    <span class="hljs-comment">// shared</span>

<span class="hljs-function">Image <span class="hljs-title">load</span><span class="hljs-params">(<span class="hljs-type">const</span> std::string&amp; path)</span> </span>{
    <span class="hljs-keyword">auto</span> it = cache.<span class="hljs-built_in">find</span>(path);
    <span class="hljs-keyword">if</span> (it != cache.<span class="hljs-built_in">end</span>()) <span class="hljs-keyword">return</span> it-&gt;second;
    Image img = <span class="hljs-built_in">readFromDisk</span>(path);
    cache[path] = img;
    <span class="hljs-keyword">return</span> img;
}
</code></pre>
<ul>
<li data-marpit-fragment="1">From <code>find</code> to <code>cache[path] = img</code> — check-then-act. Two threads<br />
both miss, both read the disk, both write — and two writes at once<br />
can corrupt the map itself.</li>
</ul>

<h2 id="the-bounded-stack--the-sentence-on-the-board">The bounded stack — the sentence on the board</h2>
<blockquote>
<p>An invariant may be broken <strong>inside</strong> a method, as long as it is<br />
restored before the method returns.</p>
</blockquote>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp"><span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">push</span><span class="hljs-params">(<span class="hljs-type">int</span> v)</span> </span>{

    size++;            <span class="hljs-comment">// step 2: count it</span>
}
</code></pre>
<ul>
<li data-marpit-fragment="1">One thread: nobody else runs between step 1 and step 2</li>
<li data-marpit-fragment="2">Two threads: the other <code>push</code> can run right in between</li>
</ul>

<h2 id="mutual-exclusion">Mutual exclusion</h2>
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><strong>Mutual exclusion</strong> — at most one thread inside a critical section<br />
at a time.</p>
</blockquote>
</li>
<li data-marpit-fragment="2">
<blockquote>
<p>A <strong>mutex</strong> enforces it. <code>lock()</code> waits until the mutex is free,<br />
then takes it; <code>unlock()</code> gives it back.</p>
</blockquote>
</li>
<li data-marpit-fragment="3">A thread that calls <code>lock()</code> while another thread holds it <strong>waits</strong> —<br />
the OS parks it until the mutex is free</li>
</ul>
<footer>Races, Critical Sections &amp; Mutexes</footer>
</section>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-cpp">std::queue&lt;Job&gt; jobs;                    <span class="hljs-comment">// shared, filled by another thread</span>

<span class="hljs-function"><span class="hljs-type">void</span> <span class="hljs-title">worker</span><span class="hljs-params">()</span> </span>{
    <span class="hljs-keyword">for</span> (;;) {
        <span class="hljs-keyword">if</span> (!jobs.<span class="hljs-built_in">empty</span>()) {
            Job j = jobs.<span class="hljs-built_in">front</span>();
            jobs.<span class="hljs-built_in">pop</span>();
            <span class="hljs-built_in">run</span>(j);
        }

<h2 id="mutexes-what-they-fix-what-they-bring">Mutexes: what they fix, what they bring</h2>
<ul>
<li data-marpit-fragment="1"><strong>They fix</strong> — data races, and other threads seeing half-done states</li>
<li data-marpit-fragment="2"><strong>They don't fix</strong> — API races: a sequence of locked calls is not one<br />
locked call</li>
<li data-marpit-fragment="3"><strong>They bring</strong> — deadlock, locking twice, waiting on someone else's code,<br />
and contention: slower code</li>
</ul>
<footer>Races, Critical Sections &amp; Mutexes</footer>
</section>
