name: Playground CI

on:
  push:
  pull_request:

jobs:
  cpp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S playground/cpp -B playground/cpp/build
      - name: Build
        run: cmake --build playground/cpp/build --config Release
      - name: Test
        working-directory: playground/cpp/build
        run: ctest --output-on-failure -C Release

  # Python/Java/Go run on Linux only: their toolchains are portable enough
  # (interpreted / managed runtimes) that per-OS testing here adds CI time
  # without catching real bugs. C++ keeps the full matrix because compiler
  # and standard-library behavior genuinely differs across platforms.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test
        working-directory: playground/python
        run: python -m unittest discover -s . -p "test_*.py" -v

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Test
        working-directory: playground/java
        run: mvn -B test

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Test
        working-directory: playground/go
        run: go test ./...
